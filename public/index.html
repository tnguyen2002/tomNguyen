    <!--
      Fonts live in public/ and are declared here rather than in src/index.css
      for two reasons:
        1. css-loader resolves root-absolute url("/fonts/...") against the repo
           root, so that form fails the build inside src/.
        2. A file under src/ gets content-hashed by webpack, so its final name
           is unknowable at HTML-authoring time and cannot be preloaded.
      The `crossorigin` attribute is mandatory — fonts are always fetched in
      CORS mode, and omitting it causes the file to be downloaded twice.
      Bump the -v1 suffix to bust caches; public/ files are not hashed.
    -->
    <!-- Geist is no longer preloaded: the font stack puts the system UI font
         first, so on Apple devices (San Francisco) these files are never
         fetched at all. They stay declared as the non-Apple fallback and load
         on demand there. -->
    <style>
      /* Geist is the non-Apple fallback only — on macOS and iOS the font stack
         resolves to San Francisco first and this is never fetched. Geist Mono
         is gone: the site uses one family throughout, matching macOS, which has
         no monospace in its UI chrome. */
      @font-face {
        font-family: "Geist";
        src: url("/fonts/geist-variable-latin-v1.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
    </style>
